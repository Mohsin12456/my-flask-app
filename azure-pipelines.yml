trigger:
- main

pool:
  name: Default
  demands:
  - Agent.Name -equals windows-agent-01

variables:
  FLASK_PORT: '5000'

steps:
- checkout: self
  fetchDepth: 1

# Proof step (so you can confirm YAML is being executed)
- powershell: |
    Write-Host 'PROOF: YAML steps are running'
    Write-Host 'Repo:' "$(Build.Repository.Name)"
    Write-Host 'Branch:' "$(Build.SourceBranch)"
  displayName: 'Proof step'

# 1) Check Python available on self-hosted Windows agent
- powershell: |
    Write-Host '=== Python check ==='
    where py
    py -V
    py -0p
  displayName: 'Check Python on agent'

# 2) Install dependencies
- powershell: |
    Write-Host '=== Install dependencies ==='
    py -m pip install --upgrade pip
    py -m pip install -r requirements.txt
  displayName: 'Install dependencies'

# 3) Optional tests (enable if you have tests)
# - powershell: |
#     Write-Host '=== Run tests ==='
#     py -m pip install pytest
#     py -m pytest -q
#   displayName: 'Run tests'

# 4) Smoke test: start Flask, call locally, stop
- powershell: |
    Write-Host '=== Smoke test (local) ==='

    $env:PORT = '$(FLASK_PORT)'

    # Start Flask
    $p = Start-Process -PassThru -NoNewWindow -FilePath 'py' -ArgumentList 'app.py'
    Start-Sleep -Seconds 8

    # Call locally (adjust path if your app isn't on /)
    $url = ("http://127.0.0.1:{0}/" -f $env:PORT)
    Write-Host "Calling $url"
    curl $url | Select-Object -First 50

    # Stop Flask
    Stop-Process -Id $p.Id -Force
  displayName: 'Smoke test (local)'
