trigger:
- main

pool:
  name: Default
  demands:
  - Agent.Name -equals windows-agent-01

steps:
- checkout: self

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
    addToPath: true

- powershell: |
    python --version
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: Install dependencies

- powershell: |
    # Optional: run tests if you have them
    # pip install pytest
    # pytest -q
    Write-Host "Starting Flask (for verification only)..."
    Start-Process -NoNewWindow -FilePath python -ArgumentList "app.py"
    Start-Sleep -Seconds 10
    curl http://127.0.0.1:5000/ | Select-Object -First 20
  displayName: Smoke test (local)
