trigger:
- main

pool:
  name: Default
  demands:
  - Agent.Name -equals windows-agent-01

variables:
  FLASK_PORT: "5000"

steps:
- checkout: self
  fetchDepth: 1

# 1) Verify Python exists on the agent
- powershell: |
    Write-Host "=== Python check ==="
    where python
    python --version
    py -V
  displayName: "Check Python on agent"

# 2) Install dependencies
- powershell: |
    Write-Host "=== Install dependencies ==="
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: "Install dependencies"

# 3) (Optional) Run tests - enable if you have tests/pytest
# - powershell: |
#     pip install pytest
#     pytest -q
#   displayName: "Run tests"

# 4) Smoke test: start Flask, curl locally, then stop
- powershell: |
    Write-Host "=== Smoke test (local) ==="

    # Start Flask in background
    $env:FLASK_ENV = "production"
    $env:PORT = "$(FLASK_PORT)"

    $p = Start-Process -PassThru -NoNewWindow -FilePath "python" -ArgumentList "app.py"
    Start-Sleep -Seconds 8

    Write-Host "Calling http://127.0.0.1:$env:PORT/"
    curl "http://127.0.0.1:$env:PORT/" | Select-Object -First 50

    # Stop Flask
    Stop-Process -Id $p.Id -Force
  displayName: "Smoke test (local)"
