trigger:
- main

pool:
  name: Default
  demands:
  - Agent.Name -equals windows-agent-01

variables:
  FLASK_PORT: '5000'

steps:
- checkout: self
  fetchDepth: 1

- powershell: |
    Write-Host "PROOF: YAML is running"
    Write-Host "Agent: $(Agent.Name)"
    Write-Host "Repo: $(Build.Repository.Name)"
    Write-Host "Branch: $(Build.SourceBranch)"
  displayName: 'Proof step'

- powershell: |
    Write-Host "=== Python check (py launcher) ==="
    where py
    py -V
    py -0p
  displayName: 'Check Python (py)'

- powershell: |
    Write-Host "=== Install dependencies ==="
    py -m pip install --upgrade pip
    py -m pip install -r requirements.txt
  displayName: 'Install dependencies'

- powershell: |
    Write-Host "=== Smoke test (local) ==="
    $env:PORT = '$(FLASK_PORT)'

    # Start Flask
    $p = Start-Process -PassThru -NoNewWindow -FilePath "py" -ArgumentList "app.py"
    Write-Host "Started Flask PID: $($p.Id)"
    Start-Sleep -Seconds 3

    $url = ("http://127.0.0.1:{0}/" -f $env:PORT)
    Write-Host "Calling $url"

    $ok = $false
    try {
      for ($i=1; $i -le 10; $i++) {
        try {
          $resp = curl $url
          Write-Host ($resp | Select-Object -First 50)
          $ok = $true
          break
        } catch {
          Write-Host "Attempt $i failed, retrying..."
          Start-Sleep -Seconds 2
        }
      }
    } finally {
      # Always stop Flask
      if ($p -and !$p.HasExited) {
        Stop-Process -Id $p.Id -Force
      }
    }

    if (-not $ok) {
      throw "Smoke test failed: could not reach $url"
    }
  displayName: 'Smoke test (local)'
