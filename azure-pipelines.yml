trigger:
- main

pool:
  name: Default
  demands:
  - Agent.Name -equals windows-agent-01

variables:
  FLASK_PORT: '5000'

steps:
- checkout: self
  fetchDepth: 1

- powershell: |
    Write-Host "PROOF: YAML is running"
    Write-Host "Agent: $(Agent.Name)"
    Write-Host "Repo: $(Build.Repository.Name)"
    Write-Host "Branch: $(Build.SourceBranch)"
  displayName: 'Proof step'

- powershell: |
    Write-Host "=== Python check (py launcher) ==="
    where py
    py -V
    py -0p
  displayName: 'Check Python (py)'

- powershell: |
    Write-Host "=== Smoke test (local) ==="
    $env:PORT = '$(FLASK_PORT)'

    # Start Flask
    $p = Start-Process -PassThru -NoNewWindow -FilePath "py" -ArgumentList "app.py"
    Write-Host "Started Flask PID: $($p.Id)"
    Start-Sleep -Seconds 3

    $url = ("http://127.0.0.1:{0}/" -f $env:PORT)
    Write-Host "Calling $url"

    $ok = $false
    try {
      for ($i=1; $i -le 10; $i++) {
        try {
          $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5
          Write-Host "StatusCode:" $r.StatusCode
          Write-Host ($r.Content.Substring(0, [Math]::Min(200, $r.Content.Length)))
          if ($r.StatusCode -eq 200) { $ok = $true; break }
        } catch {
          Write-Host "Attempt $i failed: $($_.Exception.Message)"
          Start-Sleep -Seconds 2
        }
      }
    } finally {
      if ($p -and !$p.HasExited) { Stop-Process -Id $p.Id -Force }
    }

    if (-not $ok) { throw "Smoke test failed: could not get HTTP 200 from $url" }
  displayName: 'Smoke test (local)'
